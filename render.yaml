services:
  - type: web
    name: interrogation-room-backend
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: '*'
      - key: MONGODB_URI
        sync: false
